name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: honeypot-rust

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust format check
        run: cargo fmt --all -- --check

      - name: Rust compile check
        run: cargo check --all-targets --all-features

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --all-targets --all-features -- --nocapture

  python:
    name: Python checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: analysis-engine

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: analysis-engine/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate event schema examples
        run: python -m app.validators.validate_examples

      - name: Python compile check
        run: python -m compileall app

  repo-sanity:
    name: Repository sanity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify workflow and key files exist
        run: |
          test -f README.md
          test -f docker-compose.yml
          test -f schemas/events/event_schema_v1.json
          test -f analysis-engine/requirements.txt
          test -f honeypot-rust/Cargo.toml
